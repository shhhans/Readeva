<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Readeva</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- 书库视图 -->
    <section id="view-library" class="view">
      <header class="topbar">
        <h1>Readeva 书库</h1>
        <span class="spacer"></span>
        <label class="button primary" for="import-input">导入 PDF</label>
        <input id="import-input" type="file" accept="application/pdf,.pdf" multiple hidden />
        <button id="settings-button" type="button">服务设置</button>
      </header>
      <main class="library-main">
        <p id="import-status" class="status" hidden></p>
        <div id="library-empty" class="empty" hidden>
          书库为空：点击「导入 PDF」添加有文字层的 PDF 文档。
        </div>
        <table id="library-table" hidden>
          <thead>
            <tr>
              <th>名称</th>
              <th>页数</th>
              <th>大小</th>
              <th>内容身份 (SHA-256)</th>
              <th>上次阅读</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="library-tbody"></tbody>
        </table>
      </main>
      <dialog id="settings-dialog">
        <form method="dialog">
          <h2>服务设置</h2>
          <label>
            服务地址
            <input id="service-url-input" type="text" placeholder="留空使用当前页面同源地址" />
          </label>
          <p class="hint">解析服务是独立进程，可部署在本机或远端；关闭浏览器不会终止服务。</p>
          <div class="dialog-actions">
            <button value="cancel" type="submit">取消</button>
            <button value="save" id="settings-save" type="submit">保存</button>
          </div>
        </form>
      </dialog>
    </section>

    <!-- 阅读视图 -->
    <section id="view-reader" class="view" hidden>
      <header class="topbar reader-bar">
        <button id="back-button" type="button">← 书库</button>
        <span id="reader-title" class="title"></span>
        <span id="reader-identity" class="muted mono"></span>
        <span class="spacer"></span>
        <div class="reader-controls">
          <button id="page-prev" type="button" title="上一页">上一页</button>
          <span class="page-box">
            <input id="page-input" type="number" min="1" value="1" aria-label="页码" />
            <span class="muted">/ <span id="page-total">–</span></span>
          </span>
          <button id="page-next" type="button" title="下一页">下一页</button>
          <span class="controls-divider"></span>
          <button id="zoom-out" type="button" title="缩小">−</button>
          <span id="zoom-level" class="mono">100%</span>
          <button id="zoom-in" type="button" title="放大">＋</button>
          <button id="zoom-fit" type="button" title="适配宽度">适配宽度</button>
        </div>
      </header>
      <p id="reader-error" class="status" hidden></p>
      <div id="reader-split">
        <div id="viewer">
          <div id="page-stage">
            <canvas id="pdf-canvas"></canvas>
            <div id="page-overlay" aria-hidden="true"></div>
          </div>
        </div>
        <aside id="parse-panel">
          <header class="parse-panel-header">
            <h2>结构化内容</h2>
            <!-- 整体进度：面板头部一处静态文本，事件更新（派发/完成/失败/重试）+ 阅读期间慢刷新（8s）。 -->
            <span id="parse-summary" class="parse-summary" hidden></span>
          </header>
          <p id="parse-hint" class="parse-hint" hidden>
            解析服务未配置：启动独立 Docling 服务并在服务端设置 READEVA_DOCLING_URL 后，
            当前页的结构化内容会展示在这里。
          </p>
          <!-- 内容列表：顶部为当前页内联状态条目（徽标/失败原因/重试），下方为内容块。 -->
          <div id="parse-content" class="parse-content">
            <div id="parse-state" class="parse-state"></div>
            <div id="parse-blocks" class="parse-blocks"></div>
          </div>
          <!-- 词典卡片（Issue #7）：选词查询 ECDICT 离线词典的结果区，停靠在面板底部。 -->
          <div id="dict-card" hidden>
            <header class="dict-card-header">
              <span id="dict-word" class="dict-word"></span>
              <span id="dict-phonetic" class="dict-phonetic mono" hidden></span>
              <span class="spacer"></span>
              <button id="dict-close" type="button" title="关闭词典结果" aria-label="关闭词典结果">×</button>
            </header>
            <div class="dict-body">
              <p id="dict-status" class="dict-status" hidden></p>
              <div id="dict-translation" class="dict-section" hidden>
                <span class="dict-label">释义</span>
                <p id="dict-translation-text" class="dict-text"></p>
              </div>
              <div id="dict-definition" class="dict-section" hidden>
                <span class="dict-label">英释</span>
                <p id="dict-definition-text" class="dict-text"></p>
              </div>
              <div id="dict-meta" class="dict-meta" hidden></div>
            </div>
            <footer class="dict-card-footer">释义来自本地 ECDICT 词典（MIT License）· 离线查询</footer>
          </div>
        </aside>
      </div>
      <!-- 主动定位失败提示（悬浮失败静默不打断阅读，主动定位失败可提示）。 -->
      <div id="locate-toast" role="status" hidden></div>
      <!-- 选词工具条（Issue #7）：在右侧内容选中文本后浮现，点「查词」发起 ECDICT 离线查询。 -->
      <div id="selection-toolbar" hidden>
        <button id="dict-lookup-button" type="button">查词</button>
      </div>
    </section>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
